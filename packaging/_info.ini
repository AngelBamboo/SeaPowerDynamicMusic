[Language_cn]
Name=动态音乐
Description=让音乐跟随游戏场景自动切换：在主菜单、战略地图、战役内外、任务结算之间自动换曲。内置游戏内管理面板（默认 F7），可以试听、调权重与优先、暂停与跳转进度、重新扫描。面板界面可中英文切换，默认跟随游戏语言。使用前需要先安装 Anchor Chain。

[Language_en]
Name=Dynamic Music
Description=Music that follows the game: it switches by itself between the main menu, strategic map, in-mission and mission results. Comes with an in-game panel (F7 by default) for auditioning tracks, adjusting weight and priority, pausing, scrubbing and rescanning. The panel speaks Chinese or English and follows the game language by default. Requires Anchor Chain.

[Language_de]
Name=Dynamische Musik
Description=Musik, die dem Spiel folgt und automatisch zwischen Hauptmenü, strategischer Karte, Mission und Missionsergebnis wechselt. Mit einem Verwaltungspanel im Spiel (standardmäßig F7) zum Anhören, Einstellen von Gewicht und Priorität, Pausieren und Neuladen der Bibliothek. Das Panel ist auf Chinesisch oder Englisch und folgt standardmäßig der Spielsprache. Anchor Chain muss zuvor installiert sein.

[Language_ru]
Name=Динамическая музыка
Description=Музыка следует за игрой и сама переключается между главным меню, картой, миссией и её результатами. Есть игровая панель (по умолчанию F7) для прослушивания, настройки веса и приоритета, паузы и перезагрузки библиотеки. Панель поддерживает китайский и английский и по умолчанию следует языку игры. Требуется предварительная установка Anchor Chain.

[Language_ja]
Name=ダイナミックミュージック
Description=ゲームに合わせて音楽が自動で切り替わります（メインメニュー、戦略マップ、ミッション、任務結果）。ゲーム内パネル（F7、初期設定）付き。試聴・重み付けや優先順位の調整・一時停止・進捗の移動・再読み込みができます。パネルは中国語と英語に対応し、初期状態ではゲームの言語に従います。事前に Anchor Chain のインストールが必要です。