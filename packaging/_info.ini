[Language_en]
Name=Dynamic Music
Description=Adds a configurable dynamic music system. Drop mp3/ogg/wav files into folders and the game picks tracks by situation: calm cruise, contact, combat, victory, defeat. Includes an in-game manager panel (F8 by default) for previewing tracks, adjusting volume and rescanning. Requires Anchor Chain to be installed first.

[Language_cn]
Name=动态音乐系统
Description=为游戏加入可自由配置的动态音乐。把 mp3/ogg/wav 放进文件夹即可被识别，游戏会按战况自动切歌：平静巡航、发现敌情、交战、胜利、失败。内置游戏内管理面板（默认 F8），可以试听曲目、调整音量、重新扫描。使用前需要先安装 Anchor Chain。

[Language_de]
Name=Dynamische Musik
Description=Fügt ein konfigurierbares dynamisches Musiksystem hinzu. Legen Sie mp3/ogg/wav-Dateien in Ordnern ab, und das Spiel wählt Titel je nach Situation: ruhige Fahrt, Kontakt, Gefecht, Sieg, Niederlage. Enthält ein Verwaltungsfenster im Spiel (standardmäßig F8). Erfordert die vorherige Installation von Anchor Chain.

[Language_ru]
Name=Динамическая музыка
Description=Добавляет настраиваемую систему динамической музыки. Поместите файлы mp3/ogg/wav в папки, и игра будет выбирать треки по ситуации: спокойный поход, контакт, бой, победа, поражение. Включает панель управления в игре (по умолчанию F8). Требуется предварительная установка Anchor Chain.

[Language_ja]
Name=ダイナミックミュージック
Description=設定可能なダイナミック音楽システムを追加します。フォルダに mp3/ogg/wav を置くと、状況に応じて自動で曲を切り替えます（平穏な航海、接触、交戦、勝利、敗北）。ゲーム内管理パネル付き（既定は F8）。事前に Anchor Chain のインストールが必要です。

[Compatibility]
GreaterThanEqualToVersion=0.4.0
LessThanVersion=1.0.0
