[Language_cn]
Name=动态音乐扩展包
Description=为动态音乐模组提供额外的背景音乐。安装后这些音乐会出现在面板的对应分类里，与你自己放的音乐一起参与播放。需要先安装动态音乐模组与 Anchor Chain。本包不含任何官方游戏音频。

[Language_en]
Name=Dynamic Music Pack
Description=Additional background music for the Dynamic Music mod. Once installed these tracks appear in the panel under their matching categories and play alongside your own music. Requires the Dynamic Music mod and Anchor Chain. This pack contains no official game audio.

[Language_de]
Name=Dynamische Musik Erweiterung
Description=Zusätzliche Hintergrundmusik für das Dynamic-Music-Modul. Nach der Installation erscheinen die Titel im Panel unter den passenden Kategorien und laufen zusammen mit der eigenen Musik. Benötigt das Dynamic-Music-Modul und Anchor Chain. Dieses Paket enthält keine offizielle Spielmusik.

[Language_ru]
Name=Дополнение к динамической музыке
Description=Дополнительная фоновая музыка для мода Dynamic Music. После установки треки появятся в панели по соответствующим категориям и будут играть вместе с вашей собственной музыкой. Требуется мод Dynamic Music и Anchor Chain. В этом пакете нет официальной музыки игры.

[Language_ja]
Name=ダイナミックミュージック パック
Description=ダイナミックミュージックモック用の追加BGMです。インストールするとパネル内の該当カテゴリに表示され、自分の音楽と一緒に再生されます。ダイナミックミュージックモックと Anchor Chain が必要です。本パックに公式ゲーム音楽は含まれていません。