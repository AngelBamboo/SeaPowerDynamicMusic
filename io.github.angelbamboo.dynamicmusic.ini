# Sea Power Dynamic Music 参考配置
#
# Anchor Chain 首次运行时会把这个文件复制到
#   Sea Power_Data\StreamingAssets\ACConfigs\ 下并加上 _user 后缀，
# 之后请修改那份用户文件，改动不会被模组更新覆盖。
#
# 归类曲目的两种方式，可以混用：
#   1. 直接把音频放进 MusicLibrary 下的同名分类文件夹，
#      例如 MusicLibrary\Nato\battle.mp3
#   2. 在下面的分类节里写 Track01=路径
# 第 2 种优先，适合不想挪动原文件的情况。
#
# 路径可写相对 MusicLibrary 的路径，也可写绝对路径。
# 支持的格式：mp3 / ogg / wav / aiff

[General]
# 总开关。false 时不加载任何自定义音乐，游戏原生音乐照常播放。
Enabled=true
# 音乐库文件夹。相对路径以游戏根目录为基准，也可以填绝对路径。
LibraryPath=MusicLibrary
# 原版模式。true 时本模组完全不介入，由游戏按原本逻辑播放官方音乐。
VanillaMode=false
# 输出详细日志，排查问题时打开。
VerboseLog=false

[Audio]
# 总音量 0~1
Volume=0.1
# 切歌淡入淡出时长，单位秒。设为 0 则直接切。
FadeSeconds=2.0
# 同一分类内是否按权重随机。false 表示按列表顺序循环。
Shuffle=true
# 播放自定义音乐时停掉游戏原生音乐。
ReplaceVanillaMusic=true
# 是否把游戏自带音乐也纳入随机池。关掉则只播你自己放的曲子。
IncludeOfficialMusic=true

[Timing]
# 两次场景切换之间的最小间隔，防止来回抖动
SceneSwitchCooldown=15.0

[Panel]
# 是否启用游戏内管理面板
Enabled=true
# 呼出面板的快捷键，可选 F7 / F8 / F9 / Insert / Home
Hotkey=F7
# 界面语言。Chinese=简体中文，English=英文。
# 这项留空或写 Auto 时跟随游戏设置：游戏是中文就显示中文，其余显示英文。
Language=

# 下面按场景归类。某个分类没有曲目时会自动退让到其他分类。
#
